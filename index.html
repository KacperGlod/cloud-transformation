<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<meta name="description" content="Viewer i konwerter chmur punktów LAS/LAZ oparty na Potree">
	<title>Cloud Transformation</title>

	<link rel="stylesheet" href="./build/potree/potree.css">
	<link rel="stylesheet" href="./libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" href="./libs/openlayers3/ol.css">
	<link rel="stylesheet" href="./libs/spectrum/spectrum.css">
	<link rel="stylesheet" href="./libs/jstree/themes/mixed/style.css">

	<style>
		:root {
			color-scheme: dark;
			font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		button,
		input,
		select {
			font: inherit;
		}

		#viewer_status {
			position: fixed;
			top: 1rem;
			left: 50%;
			z-index: 1000;
			max-width: min(38rem, calc(100% - 2rem));
			padding: 0.75rem 1rem;
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 0.55rem;
			background: rgba(17, 22, 28, 0.92);
			box-shadow: 0 0.4rem 1.3rem rgba(0, 0, 0, 0.35);
			color: #fff;
			font-size: 14px;
			line-height: 1.4;
			transform: translateX(-50%);
		}

		#viewer_status[data-kind="error"] {
			border-color: rgba(255, 104, 104, 0.65);
			background: rgba(88, 24, 24, 0.94);
		}

		#viewer_status[hidden],
		#import_panel[hidden] {
			display: none;
		}

		#import_toggle {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 1100;
			padding: 0.7rem 1rem;
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 0.55rem;
			background: rgba(20, 27, 35, 0.92);
			box-shadow: 0 0.4rem 1.2rem rgba(0, 0, 0, 0.3);
			color: #fff;
			cursor: pointer;
		}

		#import_toggle:hover,
		#import_toggle:focus-visible {
			background: rgba(34, 45, 57, 0.98);
		}

		#import_panel {
			position: fixed;
			top: 1rem;
			right: 1rem;
			z-index: 1200;
			box-sizing: border-box;
			width: min(24rem, calc(100% - 2rem));
			max-height: calc(100% - 2rem);
			overflow-y: auto;
			padding: 1rem;
			border: 1px solid rgba(255, 255, 255, 0.18);
			border-radius: 0.7rem;
			background: rgba(18, 24, 31, 0.97);
			box-shadow: 0 0.8rem 2.2rem rgba(0, 0, 0, 0.45);
			color: #f4f7fa;
		}

		.import-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			margin-bottom: 1rem;
		}

		.import-header h1 {
			margin: 0;
			font-size: 1.05rem;
			font-weight: 650;
		}

		.icon-button {
			width: 2rem;
			height: 2rem;
			padding: 0;
			border: 0;
			border-radius: 0.4rem;
			background: transparent;
			color: #dbe5ee;
			font-size: 1.35rem;
			cursor: pointer;
		}

		.icon-button:hover,
		.icon-button:focus-visible {
			background: rgba(255, 255, 255, 0.1);
		}

		.form-group {
			display: grid;
			gap: 0.4rem;
			margin-top: 0.85rem;
		}

		.form-group label,
		.section-label {
			color: #bfcbd6;
			font-size: 0.78rem;
			font-weight: 650;
			letter-spacing: 0.035em;
			text-transform: uppercase;
		}

		input[type="text"],
		input[type="file"],
		select {
			box-sizing: border-box;
			width: 100%;
			min-height: 2.5rem;
			padding: 0.55rem 0.65rem;
			border: 1px solid #465565;
			border-radius: 0.45rem;
			background: #111820;
			color: #f4f7fa;
		}

		input:focus,
		select:focus {
			border-color: #4da3ff;
			outline: 2px solid rgba(77, 163, 255, 0.24);
		}

		.actions {
			display: grid;
			grid-template-columns: 1fr auto;
			gap: 0.55rem;
			margin-top: 0.65rem;
		}

		.primary-button,
		.secondary-button {
			min-height: 2.5rem;
			padding: 0.55rem 0.85rem;
			border-radius: 0.45rem;
			cursor: pointer;
		}

		.primary-button {
			border: 1px solid #56aaff;
			background: #1675d1;
			color: #fff;
			font-weight: 650;
		}

		.secondary-button {
			border: 1px solid #465565;
			background: #25313d;
			color: #eef4f8;
		}

		.primary-button:hover:not(:disabled),
		.primary-button:focus-visible:not(:disabled) {
			background: #2588e7;
		}

		.primary-button:disabled,
		.secondary-button:disabled {
			cursor: not-allowed;
			opacity: 0.55;
		}

		.panel-divider {
			margin: 1rem 0;
			border: 0;
			border-top: 1px solid rgba(255, 255, 255, 0.12);
		}

		#import_progress {
			width: 100%;
			height: 0.7rem;
			margin-top: 0.8rem;
			accent-color: #3c9eff;
		}

		#import_status {
			min-height: 1.2rem;
			margin: 0.5rem 0 0;
			color: #cbd7e2;
			font-size: 0.85rem;
			line-height: 1.4;
		}

		#import_status[data-kind="error"] {
			color: #ff9d9d;
		}

		#import_log {
			max-height: 9rem;
			overflow: auto;
			margin: 0.55rem 0 0;
			padding: 0.65rem;
			border-radius: 0.4rem;
			background: #0a0f14;
			color: #aebfce;
			font: 11px/1.45 Consolas, monospace;
			white-space: pre-wrap;
		}

		.helper-text {
			margin: 0.45rem 0 0;
			color: #93a3b2;
			font-size: 0.78rem;
			line-height: 1.4;
		}

		@media (max-width: 640px) {
			#import_toggle {
				top: 0.65rem;
				right: 0.65rem;
			}

			#import_panel {
				top: 0.65rem;
				right: 0.65rem;
				width: calc(100% - 1.3rem);
				max-height: calc(100% - 1.3rem);
			}
		}
	</style>
</head>

<body>
	<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="./libs/spectrum/spectrum.js"></script>
	<script src="./libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="./libs/other/BinaryHeap.js"></script>
	<script src="./libs/tween/tween.min.js"></script>
	<script src="./libs/d3/d3.js"></script>
	<script src="./libs/proj4/proj4.js"></script>
	<script src="./libs/openlayers3/ol.js"></script>
	<script src="./libs/i18next/i18next.js"></script>
	<script src="./libs/jstree/jstree.js"></script>
	<script src="./build/potree/potree.js"></script>
	<script src="./libs/plasio/js/laslaz.js"></script>

	<div id="viewer_status">Wczytywanie chmury punktów…</div>

	<button id="import_toggle" type="button" aria-controls="import_panel" aria-expanded="false">
		Dodaj LAS/LAZ
	</button>

	<aside id="import_panel" aria-label="Import chmury punktów" hidden>
		<div class="import-header">
			<h1>Chmury punktów</h1>
			<button id="import_close" class="icon-button" type="button" aria-label="Zamknij panel">×</button>
		</div>

		<div class="section-label">Wczytaj istniejącą</div>
		<div class="actions">
			<select id="cloud_list" aria-label="Dostępne chmury punktów"></select>
			<button id="cloud_load" class="secondary-button" type="button">Wczytaj</button>
		</div>

		<hr class="panel-divider">

		<form id="import_form">
			<div class="section-label">Przekonwertuj nową</div>

			<div class="form-group">
				<label for="cloud_file">Plik LAS lub LAZ</label>
				<input id="cloud_file" name="cloudFile" type="file" accept=".las,.laz" required>
			</div>

			<div class="form-group">
				<label for="cloud_name">Nazwa chmury</label>
				<input id="cloud_name" name="cloudName" type="text" maxlength="120" required>
			</div>

			<button id="convert_button" class="primary-button" type="submit" style="width: 100%; margin-top: 0.85rem;">
				Prześlij i konwertuj
			</button>

			<progress id="import_progress" max="100" value="0"></progress>
			<p id="import_status" role="status">PotreeConverter jest gotowy.</p>
			<p class="helper-text">Duże pliki mogą konwertować się kilka lub kilkadziesiąt minut.</p>
			<details id="log_details" hidden>
				<summary>Szczegóły konwersji</summary>
				<pre id="import_log"></pre>
			</details>
		</form>
	</aside>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0; top: 0;">
		<div
			id="potree_render_area"
			style="background-image: url('./build/potree/resources/images/background.jpg');"
		></div>
		<div id="potree_sidebar_container"></div>
	</div>

	<script type="module">
		const DEFAULT_POINT_CLOUD = {
			name: "vol_total",
			url: "./pointclouds/vol_total/cloud.js",
		};
		const LAST_CLOUD_KEY = "cloud-transformation:last-cloud";

		const viewerStatus = document.getElementById("viewer_status");
		const importToggle = document.getElementById("import_toggle");
		const importPanel = document.getElementById("import_panel");
		const importClose = document.getElementById("import_close");
		const importForm = document.getElementById("import_form");
		const cloudFile = document.getElementById("cloud_file");
		const cloudName = document.getElementById("cloud_name");
		const cloudList = document.getElementById("cloud_list");
		const cloudLoad = document.getElementById("cloud_load");
		const convertButton = document.getElementById("convert_button");
		const importProgress = document.getElementById("import_progress");
		const importStatus = document.getElementById("import_status");
		const importLog = document.getElementById("import_log");
		const logDetails = document.getElementById("log_details");
		const renderArea = document.getElementById("potree_render_area");

		const viewer = new Potree.Viewer(renderArea);
		const loadedPointClouds = new Map();
		let activePointCloud = null;
		let availableClouds = [];
		window.viewer = viewer;

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(1_000_000);
		viewer.setBackground("gradient");
		viewer.loadSettingsFromURL();

		viewer.loadGUI(() => {
			viewer.setLanguage("en");
			$("#menu_tools").next().show();
			$("#menu_clipping").next().show();
		});

		function showViewerStatus(message, kind = "info") {
			viewerStatus.textContent = message;
			viewerStatus.dataset.kind = kind;
			viewerStatus.hidden = false;
		}

		function hideViewerStatus() {
			viewerStatus.hidden = true;
		}

		function setImportStatus(message, kind = "info") {
			importStatus.textContent = message;
			importStatus.dataset.kind = kind;
		}

		function setPanelOpen(open) {
			importPanel.hidden = !open;
			importToggle.hidden = open;
			importToggle.setAttribute("aria-expanded", String(open));
		}

		function normalizeCloudUrl(url) {
			return new URL(url, window.location.href).pathname;
		}

		async function loadPointCloud(url, name) {
			const normalizedUrl = normalizeCloudUrl(url);
			showViewerStatus(`Wczytywanie chmury "${name}"…`);

			if (loadedPointClouds.has(normalizedUrl)) {
				if (activePointCloud) {
					activePointCloud.visible = false;
				}
				activePointCloud = loadedPointClouds.get(normalizedUrl);
				activePointCloud.visible = true;
				viewer.fitToScreen();
				localStorage.setItem(LAST_CLOUD_KEY, normalizedUrl);
				hideViewerStatus();
				return;
			}

			await new Promise((resolve, reject) => {
				const timeout = window.setTimeout(() => {
					reject(new Error(`Przekroczono czas wczytywania chmury "${name}".`));
				}, 45_000);

				Potree.loadPointCloud(normalizedUrl, name, event => {
					window.clearTimeout(timeout);
					const pointCloud = event.pointcloud;
					const material = pointCloud.material;

					material.size = 1;
					material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
					material.shape = Potree.PointShape.SQUARE;

					if (activePointCloud) {
						activePointCloud.visible = false;
					}

					viewer.scene.addPointCloud(pointCloud);
					loadedPointClouds.set(normalizedUrl, pointCloud);
					activePointCloud = pointCloud;
					viewer.fitToScreen();
					localStorage.setItem(LAST_CLOUD_KEY, normalizedUrl);
					hideViewerStatus();
					resolve();
				});
			});
		}

		async function refreshCloudList() {
			const response = await fetch("/api/clouds", { cache: "no-store" });
			if (!response.ok) {
				throw new Error("Nie udało się pobrać listy chmur.");
			}

			const payload = await response.json();
			availableClouds = payload.clouds;
			cloudList.replaceChildren();

			for (const cloud of availableClouds) {
				const option = document.createElement("option");
				option.value = cloud.url;
				option.textContent = `${cloud.name} (${cloud.format})`;
				cloudList.append(option);
			}

			cloudLoad.disabled = availableClouds.length === 0;
			return availableClouds;
		}

		function uploadCloud(file, name) {
			return new Promise((resolve, reject) => {
				const query = new URLSearchParams({ filename: file.name, name });
				const request = new XMLHttpRequest();
				request.open("POST", `/api/conversions?${query}`);
				request.setRequestHeader("Content-Type", "application/octet-stream");

				request.upload.addEventListener("progress", event => {
					if (!event.lengthComputable) {
						importProgress.removeAttribute("value");
						return;
					}

					const percent = Math.round((event.loaded / event.total) * 100);
					importProgress.value = percent;
					setImportStatus(`Wysyłanie pliku: ${percent}%`);
				});

				request.addEventListener("load", () => {
					let payload;
					try {
						payload = JSON.parse(request.responseText);
					} catch {
						reject(new Error("Serwer zwrócił nieprawidłową odpowiedź."));
						return;
					}

					if (request.status !== 202) {
						reject(new Error(payload.error || "Nie udało się przesłać pliku."));
						return;
					}

					resolve(payload);
				});

				request.addEventListener("error", () => reject(new Error("Utracono połączenie z serwerem.")));
				request.send(file);
			});
		}

		async function waitForConversion(jobId) {
			while (true) {
				const response = await fetch(`/api/conversions/${encodeURIComponent(jobId)}`, { cache: "no-store" });
				if (!response.ok) {
					throw new Error("Nie udało się odczytać stanu konwersji.");
				}

				const job = await response.json();
				importLog.textContent = job.log || "";
				logDetails.hidden = !job.log;

				if (job.status === "queued") {
					importProgress.removeAttribute("value");
					setImportStatus("Plik oczekuje w kolejce do konwersji…");
				} else if (job.status === "converting") {
					if (job.progress > 0) {
						importProgress.value = job.progress;
						setImportStatus(`Konwersja: ${Math.round(job.progress)}% bieżącego etapu`);
					} else {
						importProgress.removeAttribute("value");
						setImportStatus("PotreeConverter przetwarza chmurę…");
					}
				} else if (job.status === "completed") {
					importProgress.value = 100;
					return job;
				} else if (job.status === "failed") {
					throw new Error(job.error || "Konwersja nie powiodła się.");
				}

				await new Promise(resolve => window.setTimeout(resolve, 1000));
			}
		}

		importToggle.addEventListener("click", () => setPanelOpen(true));
		importClose.addEventListener("click", () => setPanelOpen(false));

		cloudFile.addEventListener("change", () => {
			const file = cloudFile.files[0];
			if (file) {
				cloudName.value = file.name.replace(/\.(las|laz)$/i, "");
			}
		});

		cloudLoad.addEventListener("click", async () => {
			const selected = availableClouds.find(cloud => cloud.url === cloudList.value);
			if (!selected) {
				return;
			}

			try {
				await loadPointCloud(selected.url, selected.name);
				setPanelOpen(false);
			} catch (error) {
				showViewerStatus(error.message, "error");
			}
		});

		importForm.addEventListener("submit", async event => {
			event.preventDefault();
			const file = cloudFile.files[0];
			const name = cloudName.value.trim();

			if (!file || !name) {
				setImportStatus("Wybierz plik i podaj nazwę chmury.", "error");
				return;
			}

			convertButton.disabled = true;
			cloudFile.disabled = true;
			cloudName.disabled = true;
			importProgress.value = 0;
			importLog.textContent = "";
			logDetails.hidden = true;
			setImportStatus("Rozpoczynanie uploadu…");

			try {
				const uploadedJob = await uploadCloud(file, name);
				const completedJob = await waitForConversion(uploadedJob.id);
				await refreshCloudList();
				cloudList.value = completedJob.pointCloudUrl;
				await loadPointCloud(completedJob.pointCloudUrl, completedJob.name);
				setImportStatus("Gotowe. Chmura została przekonwertowana i wczytana.");
				cloudFile.value = "";
				cloudName.value = "";
			} catch (error) {
				importProgress.value = 0;
				setImportStatus(error.message, "error");
			} finally {
				convertButton.disabled = false;
				cloudFile.disabled = false;
				cloudName.disabled = false;
			}
		});

		async function initialize() {
			try {
				const healthResponse = await fetch("/api/health", { cache: "no-store" });
				const health = await healthResponse.json();
				if (!health.converterAvailable) {
					convertButton.disabled = true;
					setImportStatus("Nie znaleziono tools/PotreeConverter/PotreeConverter.exe.", "error");
				}

				const clouds = await refreshCloudList();
				const savedUrl = localStorage.getItem(LAST_CLOUD_KEY);
				const initialCloud = clouds.find(cloud => normalizeCloudUrl(cloud.url) === savedUrl)
					|| clouds.find(cloud => cloud.slug === DEFAULT_POINT_CLOUD.name)
					|| clouds[0]
					|| DEFAULT_POINT_CLOUD;

				cloudList.value = initialCloud.url;
				await loadPointCloud(initialCloud.url, initialCloud.name);
			} catch (error) {
				showViewerStatus(error.message, "error");
			}
		}

		window.addEventListener("error", event => {
			console.error(event.error || event.message);
		});

		initialize();
	</script>
</body>
</html>
